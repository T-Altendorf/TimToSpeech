services:
  tts-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timtospeech
    ports:
      - "8000:8000"
    environment:
      - CACHE_DIR=${CACHE_DIR:-/app/cache}
    volumes:
      - tts-cache:/app/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  tts-cache:
    driver: local
