version: '3.8'

services:
  tts-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timtospeech
    ports:
      - "5000:5000"
    environment:
      - CACHE_DIR=${CACHE_DIR:-/app/cache}
    volumes:
      - tts-cache:${CACHE_DIR:-/app/cache}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  tts-cache:
    driver: local
