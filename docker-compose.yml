services:
  tts-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timtospeech
    expose:
      - "${PORT:-8000}"
    environment:
      - CACHE_DIR=${CACHE_DIR:-/app/cache}
      - PORT=${PORT:-8000}
      - TTS_WAIT_TIMEOUT=${TTS_WAIT_TIMEOUT:-7.0}
      - KURDISH_TTS_API_KEY=${KURDISH_TTS_API_KEY:-}
    volumes:
      - tts-cache:/app/cache
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "sh", "-c", "curl -f http://localhost:$${PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  tts-cache:
    driver: local
